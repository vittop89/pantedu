  /api/teacher/content:
    get:
      tags:
        - 'Teacher Content'
      operationId: teacherContentIndex
      summary: 'List teacher content (filtered)'
      x-controller: 'TeacherContentController::index'
      x-middleware:
        - auth
        - 'role:teacher'
        - teacher_subjects
        - log
      responses:
        200:
          description: 'Content list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherContentList'
          headers:
            ETag:
              schema:
                type: string
                example: '"a1b2c3d4..."'
            Cache-Control:
              schema:
                type: string
                example: 'private, max-age=0, must-revalidate'
        401:
          $ref: '#/components/responses/Unauthorized'
        304:
          description: 'Not Modified (ETag match)'
        503:
          description: 'Database unavailable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: |
        Returns teacher_content rows with optional filters. ETag conditional
        GET supportato (Phase 17 + Phase 25.A4 client cache): se If-None-Match
        matcha la risposta corrente ritorna 304.

        Dal 10 settembre 2026 `Cache-Control` dice `max-age=0`: la risposta va
        sempre richiesta, e quando non è cambiato niente arriva un 304. Prima
        dichiarava trenta secondi di validità, durante i quali il browser
        rispondeva da sé — e un documento appena creato o rinominato non
        compariva nell'elenco fino allo scadere. L'ETag, sempre dal 10
        settembre, si calcola sulla risposta e non più su `max(updated_at) +
        count`, che non distingueva due scritture nello stesso secondo e non
        vedeva il filtro per permessi applicato dopo la ricerca.
      parameters:
        -
          name: type
          in: query
          schema:
            type: string
            enum:
              - esercizio
              - verifica
              - lab
              - mappa
              - risdoc
              - bes
        -
          name: subject
          in: query
          schema:
            type: string
            example: MAT
        -
          name: indirizzo
          in: query
          schema:
            type: string
            example: ITIA
        -
          name: classe
          in: query
          schema:
            type: string
            example: 3A
        -
          name: visibility
          in: query
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
        -
          name: with_metadata
          in: query
          schema:
            type: integer
            enum:
              - 0
              - 1
        -
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        -
          name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        -
          name: If-None-Match
          in: header
          schema:
            type: string
    post:
      tags:
        - 'Teacher Content'
      operationId: storeTeacherContentController
      summary: 'Store (TeacherContentController)'
      x-controller: 'TeacherContentController::store'
      x-middleware:
