; Due processi in un container: nginx e php-fpm.
;
; Perché non «php-fpm in fondo e nginx in primo piano», che sarebbe più
; leggero: se php-fpm muore, nessuno se ne accorge. Il container resta vivo
; perché nginx è vivo, e risponde 502 a ogni richiesta. Con supervisor un
; figlio che muore viene fatto ripartire, e se non riparte muore tutto il
; container — che è il comportamento giusto: un container morto viene
; sostituito, uno vivo che risponde 502 no.
;
; Perché non due container: il guadagno che si cerca è lo scambio atomico di
; **una** cosa. Due container da tenere allineati durante lo scambio sono due
; occasioni di trovarsi con la metà vecchia e la metà nuova.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
; Senza questo, supervisor scrive nella cartella corrente e in un filesystem
; di sola lettura non parte affatto.
childlogdir = /tmp

[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
; 24/9/2026 — i file e le cartelle che l'applicazione crea nei dati d'istanza
; nascono scrivibili dal gruppo (www-data), come fanno le unità dell'host con
; UMask=0007. Con la umask predefinita (022) le cartelle nascevano 0755, e il
; giro delle cancellazioni dell'art. 17, che gira sull'host come pantedu
; (utente del gruppo www-data), non poteva toglierne i file: misurato in
; produzione, 81 cartelle non scrivibili da pantedu. Niente per «altri».
umask = 007
autostart = true
autorestart = true
startretries = 3
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
startretries = 3
; nginx parte dopo: se php-fpm non è in piedi, le prime richieste
; prenderebbero 502 e il controllo di salute fallirebbe per un motivo che non
; è quello vero.
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Se uno dei due esce e non riparte, tutto il container deve morire: è il
; segnale che l'orchestratore aspetta per non mandargli traffico.
[eventlistener:muori-se-muoiono]
command = bash -c "printf 'READY\n'; while read -r riga; do echo \"$riga\" >&2; kill -SIGQUIT $PPID; done"
events = PROCESS_STATE_FATAL
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
