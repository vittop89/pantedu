# nginx dentro il container: serve gli statici e passa il PHP a php-fpm.
#
# Quello che NON fa, di proposito: TLS, limiti di frequenza, indirizzo reale
# del visitatore, intestazioni di sicurezza. Quelle stanno sul nginx dell'host,
# che sta davanti — è lui a vedere l'indirizzo vero dietro Cloudflare, e a
# tenere le zone dei limiti condivise fra i container che si susseguono. Se i
# limiti stessero qui dentro, ogni scambio azzererebbe i contatori: chi sta
# martellando il modulo di accesso ricomincerebbe da zero a ogni rilascio.
#
# Quello che invece sta qui, e ci deve stare: il percorso della radice, gli
# alias delle cartelle di codice servite come statiche, e i divieti. Sono
# decisioni dell'applicazione, e devono viaggiare con la sua immagine — così
# una cartella nuova da negare arriva insieme al codice che la crea, invece di
# aspettare che qualcuno si ricordi di toccare il vhost dell'host.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 21/9/2026 — `.mjs` non sta nella tabella dei tipi di questa immagine.
    #
    # Finiva quindi nel tipo predefinito qui sopra, `application/octet-stream`,
    # e un `import()` dinamico lo rifiuta per regola del browser: il lettore
    # PDF si fermava con «Failed to fetch dynamically imported module …
    # pdf.worker.min.*.mjs» e il pulsante TEX/PDF restava lì. Il file c'era e
    # rispondeva 200: era il tipo a non andare bene, che è il modo peggiore di
    # rompersi — sembra un problema di rete.
    #
    # Un blocco `types` qui si somma a quelli inclusi sopra, non li sostituisce.
    types {
        text/javascript  mjs;
    }

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # 128 MB come sull'host: gli import di PDF e i pacchetti delle verifiche
    # arrivano fin lì.
    client_max_body_size 128M;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/pantedu/public;
        index index.php;

        # ── L'indirizzo vero del visitatore ───────────────────────────────
        # Senza queste righe `REMOTE_ADDR` dentro il container sarebbe
        # l'indirizzo del proxy che sta davanti, e ogni richiesta sembrerebbe
        # venire dalla stessa macchina. Non è un dettaglio di comodità: il WAF
        # decide il blocco geografico, i limiti e i bandi **su REMOTE_ADDR**, e
        # `EdgeContext` lo usa per stabilire se fidarsi di `Cf-IPCountry`. Con
        # tutti gli indirizzi uguali, il geoblocco «solo Italia» diventerebbe
        # «tutti dentro» e un bando ne bandirebbe uno solo — cioè tutti.
        #
        # Ci si fida solo delle reti private da cui può arrivare il proxy: il
        # bridge di Docker, la loopback quando si gira in rete dell'host. Una
        # richiesta che arrivasse da fuori con un `X-Forwarded-For` inventato
        # non verrebbe creduta.
        set_real_ip_from 127.0.0.1;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Nessun registro degli accessi, come sull'host: conserverebbe
        # indirizzi e User-Agent in chiaro, mentre l'Informativa (§3.4)
        # dichiara che restano solo come impronte nei registri applicativi.
        # Gli errori continuano a essere registrati.
        access_log off;

        # ── Divieti, per primi ────────────────────────────────────────────
        # `views` NON c'è più fra le cartelle servite: sull'host un
        # `location /views/` la esponeva come statica, e tre file HTML —
        # compresi 26 KB di markup dell'area amministrativa — rispondevano 200
        # a chiunque. Nessuno li chiedeva: era configurazione dimenticata.
        location ~ /\.(env|git|htaccess|ht) { deny all; }
        location ~ ^/(storage|database|tools|tests|wiki|docs|app|views|bootstrap|vendor|node_modules|composer\.) {
            deny all;
        }

        # ── Cartelle di codice servite come statiche ──────────────────────
        # Stanno fuori da `public/`: è l'assetto storico, e cambiarlo adesso
        # vorrebbe dire toccare ogni riferimento nelle pagine. Il container lo
        # riproduce tale e quale.
        # ── Le librerie del browser in `public/vendor` ────────────────────
        # Quill e MathJax. `^~` fa vincere questo prefisso sulle espressioni
        # regolari: il divieto qui sopra contiene `vendor`, pensato per la
        # cartella di Composer (che sta fuori da `public/` e qui non si
        # raggiunge comunque), e fino al 14 settembre 2026 rispondeva 403 anche
        # a queste. In produzione le pagine degli esercizi arrivavano senza
        # editor e senza formule; la suite, su `php -S`, non poteva vederlo.
        # Solo file che esistono: niente PHP da qui.
        location ^~ /vendor/ { try_files $uri =404; expires 30d; access_log off; }

        location /css/  { alias /var/www/pantedu/css/;  expires 7d;  access_log off; }
        location /img/  { alias /var/www/pantedu/img/;  expires 30d; access_log off; }
        location /js/   { alias /var/www/pantedu/js/;   expires 1d;  access_log off; }
        # `/wasm/` serviva il motore WebAssembly del vecchio TikZJax, che non
        # caricava più nessuno: tolto il 23/9/2026 con la cartella (D-17).

        # ── Il lavoratore di servizio ─────────────────────────────────────
        # Non deve essere messo in cache da nessuno: un lavoratore vecchio
        # continua a servire una versione vecchia dell'applicazione anche dopo
        # un rilascio, ed è invisibile finché qualcuno non se ne lamenta.
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header Service-Worker-Allowed "/" always;
            expires off;
        }

        # ── L'applicazione ────────────────────────────────────────────────
        location /api/ {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_read_timeout 120s;
            # Il PHP fuori da `public/` non si esegue mai per richiesta HTTP:
            # se il file non c'è si risponde 404, non si va a cercarlo altrove.
            try_files $uri =404;
        }
    }
}
