; Impostazioni PHP dell'immagine.
;
; Il criterio: quello che in produzione deve essere vero **sempre** sta qui,
; dentro l'immagine, dove viaggia col codice e non può essere dimenticato su
; una macchina. Quello che cambia fra un'installazione e l'altra sta nelle
; variabili d'ambiente e in `.env.local`, che è montato.

; ── Errori ────────────────────────────────────────────────────────────────
; Mai in pagina: un messaggio d'errore mostrato a un visitatore racconta
; percorsi, versioni e a volte query. Sullo standard error sì, perché lì li
; legge il registro del container.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; ── Memoria e tempo ───────────────────────────────────────────────────────
; 128 MB per richiesta: l'import di un PDF e la composizione di una verifica
; sono le due cose che ci vanno vicino. Il conto del pool (dieci processi) è
; fatto su questo numero.
memory_limit = 128M
max_execution_time = 120

; Gli import arrivano a 128 MB come dice nginx; `post_max_size` deve stare
; sopra `upload_max_filesize`, altrimenti il caricamento muore prima di
; arrivare all'applicazione e con un errore che non spiega niente.
upload_max_filesize = 128M
post_max_size = 136M
max_file_uploads = 40

; ── Sessioni ──────────────────────────────────────────────────────────────
; Qui non ce ne sono più (14/9/2026, ADR-039). Questo commento diceva che
; l'applicazione teneva le sessioni sul database: in produzione la tabella non
; c'era, le sessioni finivano nella /tmp del container, e ogni rilascio buttava
; fuori tutti. Le impostazioni ora le mette l'applicazione, uguali in sviluppo,
; in CI e qui: Session::impostazioni (modalità stretta, pulizia, cartella) e
; session_set_cookie_params (cookie httponly, samesite, secure).

; ── opcache ───────────────────────────────────────────────────────────────
; In un'immagine il codice non cambia mai mentre gira: si può spegnere del
; tutto il controllo dei tempi di modifica. È il guadagno che l'assetto a
; container regala e quello a `git reset` non poteva avere — lì il codice
; cambiava sotto i piedi di PHP, e infatti il rilascio doveva **riavviare**
; php-fpm per svuotare la cache.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; ── Varie ─────────────────────────────────────────────────────────────────
expose_php = Off
date.timezone = "Europe/Rome"
