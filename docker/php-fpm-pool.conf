; Dimensionamento del pool, calcolato sulla macchina che c'è — non lasciato
; al predefinito.
;
; Il VPS ha 3,7 GB di memoria totale e circa 2,1 disponibili, su 2 CPU. Il
; predefinito dell'immagine (`pm = dynamic`, `max_children = 5`) sarebbe
; prudente, ma il numero che conta qui è un altro: **durante uno scambio
; convivono due container**, il vecchio che finisce le richieste in corso e il
; nuovo che ha appena superato il controllo di salute. Quindi la memoria va
; divisa per due, non per uno.
;
; Conto: un processo PHP di questa applicazione sta sotto i 90 MB (il limite
; qui sotto è 128, con margine). Dieci processi per container fanno ~900 MB;
; due container che si sovrappongono per qualche secondo fanno ~1,8 GB, che
; sta dentro i 2,1 disponibili lasciando spazio a nginx e a MariaDB — che gira
; sull'host e la sua memoria se l'è già presa.
;
; `pm = static` e non `dynamic`: con due CPU e un carico di poche richieste al
; secondo, far nascere e morire processi costa più di quanto risparmi, e
; soprattutto rende il consumo di memoria imprevedibile proprio nel momento in
; cui non deve esserlo, cioè durante lo scambio.

[www]
pm = static
pm.max_children = 10

; Riavvia un processo dopo mille richieste: se una perdita di memoria c'è, si
; ferma qui invece di crescere per giorni.
pm.max_requests = 1000

; I log dei processi vanno sullo standard error, che finisce nel registro del
; container. Dentro un'immagine immutabile un file di log è un livello che si
; butta via a ogni rilascio.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Una richiesta che supera i due minuti è appesa, non lenta: si uccide e si
; lascia traccia, invece di tenere occupato un processo su dieci.
request_terminate_timeout = 120s
request_slowlog_timeout = 20s
slowlog = /proc/self/fd/2

; Il controllo di salute passa da qui: nginx interroga `/health`, che tocca il
; database. Se php-fpm non risponde, il controllo fallisce e lo scambio non
; avviene — che è tutto il punto di questa architettura.
ping.path = /_fpm-ping
ping.response = pong
