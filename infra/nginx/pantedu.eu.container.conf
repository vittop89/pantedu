# Vhost dell'host nell'assetto a container.
#
# Differenza rispetto a `pantedu.eu.conf`: qui nginx non serve niente
# dell'applicazione. Non ha `root`, non ha alias, non parla con php-fpm. Passa
# tutto al container, che di quelle cose è padrone.
#
# Cosa RESTA qui, e perché non può stare nel container:
#
#   - TLS e certificati: il certificato è della macchina, non dell'immagine;
#   - l'indirizzo reale del visitatore dietro Cloudflare (`set_real_ip_from` +
#     `CF-Connecting-IP`): il container non vede Cloudflare, vede questo nginx;
#   - i limiti di frequenza: le zone `limit_req` vivono in memoria condivisa e
#     contano per indirizzo. Se stessero nel container, **ogni scambio
#     azzererebbe i contatori** — chi sta martellando il modulo di accesso
#     ricomincerebbe da zero a ogni rilascio;
#   - `access_log off`: l'Informativa (§3.4) dichiara che indirizzi e
#     User-Agent restano solo come impronte nei registri applicativi;
#   - Grafana, che gira sull'host su 127.0.0.1:3000 e non c'entra con l'app.
#
# Il pezzo che decide QUALE container serve sta altrove, in
# `/etc/nginx/conf.d/pantedu-upstream.conf`, scritto dal rilascio. Lo scambio è
# tutto lì: si riscrive quella riga e si ricarica nginx. Un `reload` non chiude
# le connessioni in corso — i vecchi processi finiscono quello che stavano
# facendo e poi escono — quindi nessuna richiesta viene troncata a metà.

# `Connection: upgrade` solo quando è davvero un websocket. Scritta fissa,
# quell'intestazione accetta anche `Upgrade: h2c`, che apre un tunnel HTTP/2 in
# chiaro: dentro il tunnel le richieste non ripassano dalle direttive della
# `location`, quindi `auth_request` non le vede e il cancello di Grafana si
# scavalca. Stessa mappa e stesso nome nel vhost dell'assetto sull'host: i due
# file non convivono mai, lo scambio sovrascrive quello attivo.
map $http_upgrade $connection_upgrade {
    default     "";
    "websocket" "upgrade";
}

server {
    listen 80;
    listen [::]:80;
    server_name pantedu.eu www.pantedu.eu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pantedu.eu www.pantedu.eu;

    # ── Indirizzo reale dietro Cloudflare ─────────────────────────────────
    # Riscrive $remote_addr con l'IP CLIENT reale SOLO se la connessione arriva
    # da un range Cloudflare. Serve ai limiti qui sotto e, di rimbalzo, al WAF
    # dentro il container: questo nginx passa $remote_addr in
    # `X-Forwarded-For`, e il nginx del container lo riprende.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    ssl_certificate     /etc/letsencrypt/live/pantedu.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pantedu.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log off;
    client_max_body_size 128M;

    # ── Cosa si manda al container ────────────────────────────────────────
    # `Host` originale: l'applicazione costruisce URL assoluti e deve vedere il
    # nome vero, non `pantedu_app`.
    # `X-Forwarded-Proto https`: dentro il container si parla http, e senza
    # questa riga l'applicazione crederebbe di essere su http — cookie non
    # `Secure`, redirect verso http, `HTTPS` non impostato.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 120 secondi come il vecchio `fastcgi_read_timeout`: l'estrazione da PDF
    # interroga un modello durante i sondaggi, e 75 secondi davano 504.
    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ── Il varco per Grafana ──────────────────────────────────────────────
    # `auth_request` chiama una rotta dell'applicazione, che adesso vive nel
    # container: la sottorichiesta va lì.
    location = /auth/grafana-gate {
        internal;
        proxy_pass http://pantedu_app;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /grafana/ {
        auth_request /auth/grafana-gate;
        auth_request_set $grafana_user $upstream_http_x_grafana_user;

        # Grafana gira sull'host, non nel container: non c'entra con l'app.
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER $grafana_user;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        error_page 401 = @grafana_unauthorized;
    }
    location @grafana_unauthorized {
        return 302 /login?redirect=/admin/monitoring;
    }

    # ── Il webhook che fa partire il rilascio ─────────────────────────────
    #
    # Questo NON passa dal container, ed è una scelta, non una dimenticanza.
    #
    # Due motivi. Il primo: `/_hooks/github` non è una rotta dell'applicazione —
    # è un file eseguito direttamente (`tools/webhook/github.php`), quindi
    # mandarlo al container significa mandarlo a un'applicazione che non lo
    # conosce, e prendersi un 404 dopo la pagina di sfida del WAF. È successo:
    # l'8 settembre 2026, per qualche minuto dopo lo scambio, il rilascio
    # automatico era rotto e nessuno se ne sarebbe accorto fino alla spinta
    # successiva.
    #
    # Il secondo, che conta di più: **se il container è rotto, da qui si deve
    # poter rilasciare la correzione.** Un webhook che vive dentro il container
    # non può ripararlo. Resta quindi sull'host, con php-fpm dell'host, che per
    # questo non si spegne.
    location = /_hooks/github {
        if ($request_method !~ ^POST$) { return 405; }
        client_max_body_size 1m;
        access_log off;
        error_log /var/log/nginx/pantedu-webhook.error.log warn;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/pantedu/tools/webhook/github.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REMOTE_ADDR $remote_addr;
        include fastcgi_params;
    }

    # ── Accesso: limite di bordo più stretto ──────────────────────────────
    location = /login {
        limit_req zone=pantedu_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://pantedu_app;
    }

    # ── Tutto il resto ────────────────────────────────────────────────────
    # Statici compresi: li serve il nginx del container, che sa dove stanno
    # perché stanno dentro di lui. Una cartella nuova da servire o da negare
    # arriva così insieme al codice che la crea, invece di aspettare che
    # qualcuno si ricordi di toccare questo file.
    # ── Le figure ─────────────────────────────────────────────────────────
    # Una pagina di verifica chiede una figura per volta: la più grossa in
    # produzione ne ha ottanta, e ognuna è una richiesta a `/tikz/render` —
    # prima una GET che guarda se la figura è già pronta in cache, poi una POST
    # per quelle che non ci sono. Il secchio generale (due al secondo, sessanta
    # di scorta) lo svuota una pagina sola: scorrendo fra le verifiche si
    # arrivava a «429 Too Many Requests» di nginx, cioè una pagina senza figure
    # e nessun errore che dicesse perché.
    #
    # Misurato il 20/9/2026 in produzione: cento richieste di fila a
    # `/tikz/render`, trentotto rifiutate; nel registro degli errori, novecentotto
    # figure rifiutate in un giorno.
    #
    # La zona `pantedu_tikz` esisteva dal 5/6/2026 per questo e non la usava
    # nessuno: dieci megabyte di memoria condivisa che non limitavano niente.
    # Dieci al secondo con duecento di scorta: la pagina più pesante passa in un
    # colpo, e chi ne apre una dietro l'altra non si ferma. Il limite resta —
    # queste rotte vogliono comunque una sessione, e la compilazione vera la
    # protegge la cache per impronta del sorgente.
    location ^~ /tikz/ {
        limit_req zone=pantedu_tikz burst=200 nodelay;
        limit_conn pantedu_conn 24;
        limit_req_status 429;
        proxy_pass http://pantedu_app;
    }

    location / {
        limit_req zone=pantedu_general burst=60 nodelay;
        limit_conn pantedu_conn 24;
        limit_req_status 429;
        proxy_pass http://pantedu_app;
    }
}
