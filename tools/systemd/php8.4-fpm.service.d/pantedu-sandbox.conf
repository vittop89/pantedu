# Sandbox di systemd per il PHP-FPM dell'host (Debian Trixie, PHP 8.4).
#
# Sull'host PHP-FPM serve una cosa sola: il webhook del rilascio, la location
# `/_hooks/github` del vhost. L'applicazione gira nei container. Il webhook
# deve funzionare anche quando il container è rotto, perché è da lì che arriva
# la correzione: la sandbox si prova quindi sul webhook, non sulla home del
# sito, che risponde dal container comunque.
#
# Fino al 24/9/2026 nove direttive su quattordici avevano un commento sulla
# stessa riga del valore («ProtectSystem=full   # …»). systemd non conosce i
# commenti in linea: le scartava con «Failed to parse …, ignoring», e
# restavano valide solo PrivateTmp, ProtectHome, ProtectClock, ProtectHostname
# e LimitNOFILE. Lo mostra `systemd-analyze verify` su questo file nella forma
# di prima. Il 24/9 sul server non era installata. Adesso ogni commento sta
# sulla sua riga, e tests/Unit/Ops/UnitaSenzaCommentiInLineaTest.php impedisce
# che torni la forma di prima in qualunque unità di tools/systemd.
#
# Tolte a maggio rispetto alla prima versione, perché fermavano PHP-FPM:
# - ProtectProc=invisible e ProcSubset=pid: il master vedeva i worker da /proc,
#   e moriva con SIGSYS;
# - MemoryDenyWriteExecute=true: PHP genera codice a runtime;
# - SystemCallFilter=@system-service: SIGSYS, status=31;
# - CapabilityBoundingSet: il master ne usa alcune per avviare i worker;
# - ProtectSystem=strict: toglieva la lettura di /etc/php a runtime (full basta);
# - RestrictNamespaces: PHP li usa;
# - RestrictAddressFamilies: servivano alle chiamate in uscita di allora.
#
# Installazione, prova e ritorno indietro: docs/dev/ci-cd.md, «Che cosa il
# rilascio non installa».

[Service]
# File system: /usr, /boot e /etc in sola lettura (strict no, vedi sopra);
# /tmp privata; /home e /root invisibili.
PrivateTmp=true
ProtectHome=true
ProtectSystem=full

# Privilegi: niente setuid verso l'alto, niente file suid/sgid nuovi.
# Il master che avvia i worker come www-data scende di privilegio, e questo
# resta permesso.
NoNewPrivileges=true
RestrictSUIDSGID=true

# Kernel: /proc/sys e /sys/fs/cgroup in sola lettura, niente /proc/kmsg.
ProtectKernelTunables=true
ProtectKernelLogs=true
ProtectControlGroups=true

# Orologio e nome della macchina non si toccano.
ProtectClock=true
ProtectHostname=true

# Dispositivi: solo quelli di base (/dev/null, /dev/zero, /dev/urandom…).
PrivateDevices=true

# Niente priorità in tempo reale, niente personality().
RestrictRealtime=true
LockPersonality=true

# Limiti.
LimitNOFILE=8192
