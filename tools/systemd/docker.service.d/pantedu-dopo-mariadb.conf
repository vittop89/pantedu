# All'avvio della macchina, Docker parte dopo MariaDB (15/9/2026).
#
# Il container del sito monta il socket di MariaDB (`/run/mysqld/mysqld.sock`)
# e ha `--restart unless-stopped`: Docker lo riavvia appena parte. Il 15
# settembre 2026, al riavvio per le regole di audit, Docker e MariaDB sono
# partiti nello stesso secondo (23:19:23). Docker ha trovato il socket mancante
# e, con `-v`, al suo posto ha creato una cartella vuota; MariaDB non ha potuto
# creare il socket («Bind on unix socket: Address already in use») e si è
# fermata; il container non è partito («not a directory»). Sito e database giù
# per cinque minuti, fino al ripristino a mano. Racconto e tracce in
# `docs/ops/runbook-sito-irraggiungibile.md`.
#
# `After=` è l'ordine; `Wants=` tira dentro MariaDB se Docker parte da solo. Non
# c'è ciclo: MariaDB non ordina niente dopo Docker (misurato: le sue `After=`
# sono rete, `sysinit` e `basic.target`). MariaDB è `Type=notify`, quindi è
# «attiva» quando il socket c'è già.
#
# Accanto, dal 15/9, il rilascio monta il socket con `--mount`: se manca, Docker
# si ferma con un errore invece di creare la cartella (misurato sul VPS).
#
# Si installa in `/etc/systemd/system/docker.service.d/`, poi
# `systemctl daemon-reload`. Il rilascio a container non sincronizza le unità:
# va installato a mano, come le altre di `tools/systemd/`.

[Unit]
After=mariadb.service
Wants=mariadb.service
