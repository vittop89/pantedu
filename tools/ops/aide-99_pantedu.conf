# Regole di integrità dei file per Pantedu.
#
# 2026-09-09 — riscritte due volte nella stessa giornata. La prima riscrittura
# ha sistemato i nomi (puntavano a `/var/www/progetto-precedente`, che non esiste dal
# rinominamento) e i gruppi di attributi (`PERMS`, `Binlib`: non definiti in
# questa installazione, quindi `aide --config-check` rifiutava le regole in
# blocco). La seconda — questa — sistema il **perimetro**, ed è nata dal primo
# controllo vero che sia mai girato su questa macchina:
#
#     Total number of entries:  826213
#     Added entries:            157767
#     Removed entries:            6635
#     Changed entries:            6170
#
# Centosettantamila differenze. Un rapporto così non lo legge nessuno: è la
# stessa forma di guasto del verde che non misura, solo travestita da rosso.
#
# Guardando **dove** stavano:
#
#     112550  /var/lib/containerd
#      45149  /var/lib/docker
#      11944  /var/www/pantedu   (voci «cambiate»)
#
# Il 99,96% degli «aggiunti» erano strati di immagini dei container, che si
# riscrivono da capo a ogni rilascio. I «cambiati» sotto `/var/www/pantedu`
# sono il `git reset --hard` del rilascio: file che cambiano perché devono
# cambiare.
#
# ── Il criterio ────────────────────────────────────────────────────────────
#
# **AIDE guarda quello che nessun altro guarda, e che non deve cambiare da
# solo.**
#
# I file del repository li sorveglia git, e meglio: il rilascio fa
# `git reset --hard`, quindi una modifica non autorizzata sparisce al primo
# rilascio e nel frattempo si vede con `git status`. Gli strati dei container
# li sorveglia il registro delle immagini, e sono comunque derivati: si
# ricostruiscono. I registri crescono per mestiere.
#
# Restano ad AIDE le cose che non ha nessun altro:
#
#   - la configurazione di sistema (`/etc`): ssh, nginx, php, cron, unità
#     systemd;
#   - i binari di sistema (`/bin`, `/sbin`, `/usr`), che cambiano solo quando
#     apt aggiorna un pacchetto — ed è una cosa che vale la pena vedere;
#   - i binari installati a mano in `/usr/local` e il servizio TeX in `/opt`;
#   - i crontab degli utenti in `/var/spool/cron`;
#   - `.env.local`, che contiene i segreti, non è versionato ed è `chattr +i`
#     proprio perché **non deve mai cambiare** senza che qualcuno lo decida.
#
# Il gruppo è `Full` (= InodeData+StaticFile), che in questa installazione
# esiste davvero.

/etc                    Full
/etc/ssh                Full
/etc/cron.d             Full
/etc/systemd/system     Full
/usr/local/bin          Full
/usr/local/sbin         Full

# Le chiavi con cui si entra **non stanno qui**, e non è una dimenticanza.
#
# Una regola positiva su `/root/.ssh` non serve a niente se sopra c'è `!/root`:
# in AIDE una regola negativa **pota l'intero sottoalbero durante la visita**,
# e una regola più profonda non ha modo di riprenderselo. Non è «vince il
# prefisso più lungo», che è quello che credevo prima di provarlo:
#
#     [ ] d=ext:/root/.ssh: recursive negative rule: '!/root (none)'
#
# `authorized_keys` è sorvegliato da auditd (`tools/ops/audit-pantedu.rules`,
# chiave `pantedu_identita`), che per questa domanda è anche lo strumento
# migliore: dice **chi** l'ha modificato e quando, non solo che è cambiato il
# giorno dopo.

# Il servizio TeX: codice che gira, installato a mano, fuori da git. È
# esattamente la categoria che AIDE deve coprire, perché non lo copre nessun
# altro.
/opt/tex-compile        Full

# I crontab degli utenti. Nove voci in tutto, e sono il posto dove si mette un
# lavoro periodico che non deve dare nell'occhio.
/var/spool/cron         Full

# ── Il repository: fuori tutto, tranne i file `.env` ──────────────────────
#
# Qui non basta un'esclusione secca. `!/var/www/pantedu` pota il sottoalbero
# **compreso `.env.local`**, cioè proprio il file che questo perimetro esiste
# per sorvegliare. Provato prima di crederci:
#
#     [ ] f=ext:/var/www/pantedu/.env.local: recursive negative rule:
#         '!/var/www/pantedu (none)'
#
# Le regole di AIDE sono espressioni regolari confrontate con il percorso, e
# la soluzione sta lì.
#
# 2026-09-13 — la prima versione escludeva tutto ciò che dopo la barra comincia
# con un carattere alfanumerico, e lasciava dentro «la configurazione», cioè
# ogni nome che comincia con un punto. Ma quei file li scrive git come tutti
# gli altri, e il controllo del 13 settembre ne ha trovati cambiati cinque:
# `.dockerignore` (cambiato con la #59, identico al commit), `.env`,
# `.mcp.json`, `.pa11yci.json` e `.stylelintrc.json` (riscritti con lo stesso
# contenuto). Righe vere, e nessuna da guardare.
#
# Adesso restano dentro solo i nomi che cominciano con `.env` (tranne il
# modello versionato, `.env.example`, escluso in fondo): `.env.local`, che è il
# motivo di tutto, e qualunque copia dei segreti lasciata accanto. Il
# 13 settembre ce n'erano due, del 7 luglio e del 1° settembre, fuori da git e
# leggibili dal gruppo `www-data`; una nuova deve comparire come «aggiunta».
#
# Provata con `aide --path-check` nei due versi: `.env.local`, `.env` e
# `.env.save` dentro; `.mcp.json`, `.git/HEAD`, `app/` fuori.
!/var/www/pantedu/(?!\.env)

# `/var/www/pantedu-releases/<commit>/` e' una copia intera del repository:
# 811 MB, derivata, e resto dell'assetto «cartella di rilascio + collegamento
# simbolico» abbandonato l'8 settembre 2026 quando si e' passati ai container.
# Nessuno script, nessuna unita' systemd e nessun vhost la nomina piu'.
#
# `/var/www/pantedu-shared/` restava dentro di proposito: 35 MB fermi, e dentro
# una copia di `.env.local` ferma all'8 settembre con valori diversi da quelli
# vivi. Finche' quel file stava li', volevamo sapere se qualcuno lo toccava.
#
# 2026-09-12 — **non c'e' piu'**, e nemmeno `pantedu-releases`: sono state
# rimosse insieme fra il 9 e l'11 settembre, ripulendo l'assetto «cartella di
# rilascio + collegamento simbolico» lasciato dal passaggio ai container. Il
# controllo del 12 le ha viste sparire (1449 voci «rimosse», quasi tutto il
# rapporto di quella notte), e qui la cosa da notare e' **chi** l'ha fatto: non
# si sa. Nessuna regola di auditd copriva quei percorsi, il registro di sudo
# non ha nessun `rm` che li nomini, e nessuno script del repository li
# cancella. L'unica traccia di quella rimozione, in tutta la macchina, e' il
# rapporto di AIDE — che e' esattamente il mestiere per cui sta qui.
#
# La riga resta: se quelle cartelle tornassero, tornerebbero derivate.
!/var/www/pantedu-releases

# ── Fuori: quello che cambia da sé ─────────────────────────────────────────

# Gli strati delle immagini e lo stato dei container: derivati, ricostruibili,
# e riscritti da capo a ogni rilascio. Da soli erano il 99,96% del rumore.
!/var/lib/docker
!/var/lib/containerd
!/root/.docker

# I dati dell'applicazione e i suoi registri: cambiano a ogni richiesta.
!/var/lib/pantedu-data
!/var/lib/pantedu-deploy

# 2026-09-23 — lo stato del rilascio che solo root scrive (cartella 0700):
# oggi il solo segno `vendor-da-aggiornare`, che il rilascio lascia quando il
# vendor/ dell'host va aggiornato e toglie quando composer è riuscito
# (tools/webhook/deploy-container.sh, fra `>>> host` e `<<< host`). Compare e
# sparisce per mestiere, e quando resta lo dice già l'anomalia `vendor_host`,
# con il motivo. Dentro il perimetro, la prima volta che il rilascio crea la
# cartella il controllo della notte avrebbe una riga «aggiunta» da guardare,
# tutte le notti fino a quando qualcuno rifà la base. Nessuno la crea prima
# del primo aggiornamento di composer, quindi quel giorno arriverebbe senza
# preavviso. La prova che la cartella del segno è esclusa qui:
# tests/ops/vendor-e-versioni-legali.test.sh.
!/var/lib/pantedu-rilascio(/|$)

# Registri e basi di dati di chi osserva la macchina.
!/var/log
!/var/lib/loki
!/var/lib/promtail
!/var/lib/prometheus
!/var/lib/grafana
!/var/lib/mysql
!/var/lib/crowdsec

# Le copie di salvataggio: un file nuovo ogni notte, per costruzione.
!/var/backups

# Le cartelle di lavoro: cambiano di mestiere, e chi ci scrive dentro lo fa
# per lavorare. Il primo giro contava 1.288 voci sotto `/tmp`, 779 sotto
# `/root/.npm` e 7.775 sotto `/home/pantedu`: tutte cose che cambiano da sole
# e che avrebbero riempito il rapporto ogni notte. Le cartelle `.ssh` che
# stanno qui sotto non si possono riammettere — vedi la nota sopra — e le
# guarda auditd.
!/tmp
!/var/tmp
!/var/cache
!/root
!/home

# 2026-09-13 — `/run` intera, al posto dei pezzi che se ne toglievano uno alla
# volta (`/run/docker`, `/run/containerd`, `/run/systemd/transient`). È un
# filesystem in memoria che si ricrea a ogni avvio: file pid, socket,
# collegamenti di udev, le cartelle delle sessioni di login, gli scope dei
# container, il file di blocco del rilascio. Nel controllo del 13 settembre
# erano 108 differenze su 171 — il riavvio della sera prima, la sessione di
# root aperta mentre si rifaceva la base — tutte vere e nessuna utile.
#
# Che cosa si perde: poco. Quello che sta qui sparisce al riavvio, quindi non
# è un posto dove qualcosa resta; e un file che compare e sparisce fra due
# controlli a ventiquattr'ore di distanza AIDE non lo vede comunque. Per quello
# c'è auditd.
!/run(/|$)

# I database di AIDE stessi.
!/var/lib/aide
!/etc/aide/aide.db.*

# Trovati guardando cosa restava sotto /var/lib: sono stato che systemd e
# nginx riscrivono per mestiere. I marcatori dei timer cambiano a ogni scatto
# — con quindici timer attivi sarebbero decine di righe ogni notte, tutte vere
# e tutte inutili.
!/var/lib/nginx
!/var/lib/systemd/timers
!/var/lib/systemd/random-seed

# 2026-09-12 — il contatore del WAF, per lo stesso motivo. È l'ultimo
# identificativo di evento già esaminato: il WAF lo riscrive ogni volta che ne
# tratta uno, cioè di continuo. Rifatta la base di riferimento il 12/9, il
# primo controllo dopo lo scambio ha trovato **una** differenza in 240.317
# voci, ed era lui: mtime e impronta cambiati in due minuti. Lasciandolo
# dentro, il rapporto notturno non sarebbe mai stato pulito — e un rapporto
# che non è mai pulito è un rapporto che non si legge più.
#
# Si esclude il file, non la cartella: `/var/lib/pantedu/` oggi contiene solo
# questo, e se un domani ci comparisse dell'altro voglio vederlo una volta e
# decidere, non scoprirlo mai. La cartella resta sorvegliata, quindi un file
# nuovo si nota.
!/var/lib/pantedu/waf-last-id\.txt

# 2026-09-13 — altre cose che cambiano da sé, trovate guardando una per una le
# 171 differenze del controllo del 13 settembre.
#
# Gli indici dei pacchetti (12 differenze): `apt-daily` li riscarica due volte
# al giorno. Non si eseguono e non sono configurazione, e apt ne verifica la
# firma prima di usarli — cosa che AIDE non sa fare. Il resto di `/var/lib/apt`
# resta dentro.
!/var/lib/apt/lists(/|$)

# Il lease del DHCP: si rinnova da sé.
!/var/lib/dhcp/dhclient\.[^/]*\.leases$

# cloud-init riscrive il suo stato a ogni avvio (31 differenze). La cartella
# non si toglie: `scripts/per-boot` e `user-data` sono il posto classico dove
# mettere qualcosa che riparte come root a ogni avvio. Delle 31, 29 avevano lo
# stesso contenuto e solo le date nuove, e quelle le riconosce da sé
# `tools/ops/aide-spiega.sh`. Restano fuori i due file che contengono l'ora
# dell'avvio, e che quindi cambiano contenuto per costruzione.
!/var/lib/cloud/instances/[^/]+/boot-finished$
!/var/lib/cloud/data/status\.json$

# La copia di riserva che augenrules lascia quando rigenera `audit.rules` al
# riavvio: non la carica nessuno. `audit.rules` invece resta dentro, e
# `aide-spiega.sh` lo dà per atteso solo se `augenrules --check` conferma che è
# esattamente quello che si ricava da `rules.d`.
!/etc/audit/audit\.rules\.prev$

# Altri tre, trovati lo stesso giorno guardando le differenze della base
# rifatta.
#
# Le regole di suricata: le riscarica `/etc/cron.weekly/suricata-update-rules`
# ogni domenica alle 06:47, insieme all'archivio da cui le estrae. AIDE vedrebbe
# soltanto che il contenuto è cambiato, ogni settimana, senza poter dire se è
# quello giusto. Il resto di `/var/lib/suricata` resta dentro.
!/var/lib/suricata/rules/suricata\.rules$
!/var/lib/suricata/update/cache(/|$)

# La data dell'ultima pulizia di apt-listbugs: nove byte, riscritti dopo un
# giro di apt.
!/var/spool/apt-listbugs/lastprefclean$

# Il modello della configurazione: versionato, senza segreti, cambia con i
# commit (l'ultima volta con la #60), e le sue modifiche le vede già git.
!/var/www/pantedu/\.env\.example$
