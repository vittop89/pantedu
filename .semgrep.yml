# Semgrep custom rules (Phase 25.E1).
#
# Estende le regole standard p/php + p/javascript + p/owasp-top-10 con
# regole project-specific per Pantedu. Run da CI:
#   semgrep --config p/php --config p/javascript --config p/owasp-top-10 \
#           --config .semgrep.yml --error
#
# Le regole standard catturano XSS, SQL injection, hardcoded secrets,
# path traversal, weak crypto. Qui aggiungiamo gli idiomi pericolosi
# specifici del nostro codebase.

rules:
  # ─────── PHP project-specific ───────

  - id: php-no-direct-pdo-query
    severity: WARNING
    languages: [php]
    message: |
      Evita PDO->query() / exec() con stringa interpolata. Usa
      prepared statement con bound parameters per prevenire SQL injection.
    pattern-either:
      - pattern: $PDO->query("...$VAR...")
      - pattern: $PDO->exec("...$VAR...")
    paths:
      include:
        - app/

  # Qui c'era `php-csrf-token-required-on-post`, tolta il 9 settembre 2026.
  #
  # Era malformata — `pattern-not-inside` messo come fratello di `pattern`,
  # dove lo schema non lo ammette — e semgrep la rifiutava con «Invalid rule
  # schema». Peggio: l'azione che lanciava semgrep restituiva comunque
  # «riuscito», quindi il controllo verde non misurava niente. Sette rotte
  # scrivevano senza verificare il gettone.
  #
  # Non è stata riscritta perché la domanda non si può porre a semgrep: il
  # middleware `csrf` si applica alla **rotta**, in routes/web.php, e nessuna
  # analisi del corpo di un metodo può sapere come quel metodo è stato
  # collegato. La copertura ora la verifica
  # `tests/Unit/Core/CoperturaCsrfTest.php`, che legge la tabella delle rotte:
  # ogni rotta che scrive ha il gettone o un'esenzione scritta, e un'esenzione
  # che non corrisponde più a nessuna rotta fa fallire il test.

  - id: php-no-eval
    severity: ERROR
    languages: [php]
    message: |
      eval() / create_function() / assert(string) sono RCE vector.
      Vietati nel codebase produttivo.
    pattern-either:
      - pattern: eval(...)
      - pattern: create_function(...)
      - pattern: assert($STR)

  - id: php-superglobal-direct-use
    severity: WARNING
    languages: [php]
    message: |
      Evita uso diretto di $_GET / $_POST / $_REQUEST / $_COOKIE.
      Usa Request::query[]/post[]/cookie[] (sanitizzato) o app/Core/Request.
    pattern-either:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
    paths:
      include:
        - app/Controllers/
        - app/Services/
      exclude:
        - app/Core/Request.php  # legittimo qui

  # 2026-09-19 — la codifica d'origine non si indovina.
  #
  # Nel 2025 il vecchio sito passava ogni campo ricevuto, compreso il
  # contenuto dei drawio, per `mb_convert_encoding($v, 'UTF-8', 'auto')`.
  # Con 'auto' PHP prova ASCII prima di UTF-8: su un testo lungo con pochi
  # accenti sceglie ASCII, e ogni byte non ASCII diventa «?». Così 107 mappe
  # hanno perso le lettere accentate («unit?? di misura»), e ce ne siamo
  # accorti mesi dopo (wiki/domains/mappe/mappe-overview.md, «Caratteri
  # persi»). Si scrive la codifica vera ('UTF-8', 'ISO-8859-1'), oppure si
  # controlla con `mb_check_encoding` e si rifiuta quello che non torna.
  #
  # La prova nei due versi è in tests/semgrep/ (semgrep --test): la forma
  # del vecchio sito scatta, una codifica esplicita no.
  - id: php-mb-convert-encoding-indovinata
    severity: ERROR
    languages: [php]
    message: |
      Codifica d'origine indovinata. Con 'auto', con un elenco di codifiche o
      con mb_detect_encoding non rigoroso, PHP sceglie da sé: su un testo lungo
      con pochi accenti sceglie ASCII e ogni lettera accentata diventa «?»
      (107 mappe rovinate nel 2025). Scrivi la codifica vera, oppure controlla
      con mb_check_encoding($s, 'UTF-8') e rifiuta ciò che non è valido.
    pattern-either:
      - patterns:
          - pattern: mb_convert_encoding($S, $A, $DA)
          - metavariable-regex:
              metavariable: $DA
              regex: (?i)^["']\s*(auto|[^"']*,[^"']*)\s*["']$
      - pattern: mb_convert_encoding($S, $A, [$X, $Y, ...])
      - patterns:
          - pattern: mb_detect_encoding(...)
          - pattern-not: mb_detect_encoding($S, $E, true)

  # ─────── JS project-specific ───────

  - id: js-localstorage-no-username-prefix
    severity: WARNING
    languages: [javascript]
    message: |
      localStorage.setItem senza prefisso username per chiavi user-scoped.
      Phase 24.69+: chiavi devono essere prefissate con
      `fm.<scope>.<feature>.<username>` per evitare leak cross-utente
      sullo stesso browser. Vedi sidepage-custom-categories.js.
    patterns:
      - pattern: localStorage.setItem("$KEY", ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: '^fm\.(?!sidepage|risdoc|exercise)\.'
    paths:
      include:
        - js/modules/

  - id: js-innerhtml-with-user-data
    severity: WARNING
    languages: [javascript]
    message: |
      innerHTML con dato user-controllato è XSS vector. Usa textContent
      o escHtml() (js/modules/core/dom-utils.js Phase 25.A).
    pattern-either:
      - pattern: $EL.innerHTML = `...${$VAR}...`
      - pattern: $EL.innerHTML = "...$VAR..."

  - id: js-fetch-no-csrf-on-post
    severity: WARNING
    languages: [javascript]
    message: |
      fetch POST senza gettone CSRF. Il gettone si prende con `await
      fetchCsrf()` (js/modules/core/dom-utils.js) e si manda nell'intestazione
      `X-CSRF-Token` oppure nel campo `_csrf` del corpo.
    # 2026-09-09 — la regola escludeva solo le chiamate con un `body`, dando
    # per scontato che il gettone viaggi lì. `CsrfMiddleware` accetta anche
    # l'intestazione (`x-csrf-token`), e una POST che cancella non ha bisogno
    # di corpo: erano segnalate chiamate corrette. Ora si esclude entrambe le
    # forme, che sono entrambe legittime.
    patterns:
      - pattern: |
          fetch($URL, { method: "POST", ... })
      - pattern-not-inside: |
          fetch($URL, { method: "POST", ..., body: $BODY })
      - pattern-not-inside: |
          fetch($URL, { method: "POST", ..., headers: { ..., "X-CSRF-Token": $T, ... } })
    paths:
      include:
        - js/modules/

  # ─────── Cross-cutting ───────

  - id: hardcoded-credentials
    severity: ERROR
    languages: [php, javascript]
    message: |
      Possibile credenziale hardcoded. Usa env var (.env) + Config::get()
      (PHP) o build-time injection (JS).
    pattern-either:
      - pattern-regex: 'password\s*=\s*["''][A-Za-z0-9!@#$%^&*]{8,}["'']'
      - pattern-regex: 'api[_-]?key\s*=\s*["''][A-Za-z0-9_-]{20,}["'']'
      - pattern-regex: 'secret\s*=\s*["''][A-Za-z0-9_-]{16,}["'']'
    paths:
      exclude:
        - tests/
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/seed_*.php"
        - "**/*.example"
